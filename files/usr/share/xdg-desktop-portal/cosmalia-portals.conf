[preferred]
# xdg-desktop-portal reads this file because the session sets
# XDG_CURRENT_DESKTOP=cosmalia:COSMIC and checks the names in that list in
# order: cosmalia-portals.conf wins over the cosmic-portals.conf shipped by
# xdg-desktop-portal-cosmic. Only one file is used, so the entries that file
# provides (default, Secret) are repeated here.
#
# COSMIC keeps the interfaces it implements (FileChooser, settings, access,
# remote desktop). Screenshot and ScreenCast are disabled because
# xdg-desktop-portal-cosmic crashes on ext_image_copy_capture_session_v1
# protocol errors; install xdg-desktop-portal-wlr separately if you need them.
org.freedesktop.impl.portal.FileChooser=cosmic
org.freedesktop.impl.portal.ScreenCast=none
org.freedesktop.impl.portal.Screenshot=none

# Fallback for the interfaces the session does not pin above: try the gtk
# backend before failing the request.
default=gtk;

# gnome-keyring provides the Secret portal. Its .portal file still says
# UseIn=gnome, but UseIn is deprecated; naming the backend here selects it
# without pulling in the GNOME portal backend or Mutter.
org.freedesktop.impl.portal.Secret=gnome-keyring

# The GTK backend implements Inhibit, but its inhibitor calls
# org.gnome.SessionManager, which no Cosmalia session provides: if it were
# selected, every inhibit request would fail. Noctalia handles idle and
# suspend itself, so keep the interface unimplemented rather than broken.
org.freedesktop.impl.portal.Inhibit=none